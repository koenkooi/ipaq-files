<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 30 610 340" width="610" height="340" role="img" aria-labelledby="t d">
<title id="t">HP Photosmart Mobile Camera, seen from above</title>
<desc id="d">The camera seen from above and in front: the top faces of the body and the head with the seam between them and the shell seam along their tops, the lens barrel standing out of the head as a cylinder, and the badge and name foreshortened on the front of the body.</desc>
<!--
  SPDX-FileCopyrightText: 2026 Koen Kooi
  SPDX-License-Identifier: CC-BY-SA-4.0

  Provenance: original vector drawing of the HP Photosmart Mobile Camera
  (1.3 MP, 4x digital zoom, SD-sized plug), made from SVG geometry and
  gradients after the owner's photographs of his own unit; no photograph is
  embedded. The head is projected from a simple 3D model (box head, cylinder
  barrel) rotating about its swivel axis. "hp" and "SD" are trademarks of
  their owners; the badge and the SD mark are simplified drawings.
-->
