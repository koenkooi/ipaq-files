<title id="title">Navman SE GPS 3450 iPAQ GPS V2.0 expansion sleeve</title>
<desc id="description">Front compositing view, redrawn as vectors from the owner’s photographs on a centimetre cutting grid. Legends are outlines. Sleeve openings show what the empty part shows: the GPS sleeve’s inner back shell, or nothing through the open-framed keyboard sleeve. Dimensions outside the standard 42.8 mm CF width are photo estimates.</desc>
